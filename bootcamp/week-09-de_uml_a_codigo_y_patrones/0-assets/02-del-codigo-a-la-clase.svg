<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img">
<title>Ingeniería inversa de la clase Cart: a la izquierda cada línea del código y a la derecha el elemento de diagrama que produce; el campo customer da una asociación, la lista de líneas da una composición porque add crea cada CartLine, add y total dan operaciones, total además una dependencia hacia PriceList, y el constructor y el getter no pasan al diagrama</title>
<rect width="1000" height="580" fill="#0d1117"/>
<defs>
<marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#0d1117" stroke="#f0f6fc" stroke-width="1.2"/></marker>
<marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#f0f6fc" stroke-width="1.5"/></marker>
<marker id="dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="18" markerHeight="12" orient="auto"><path d="M1 5 L8 1 L15 5 L8 9 Z" fill="#f0f6fc"/></marker>
</defs>
<g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" fill="#8b949e"><text x="40" y="50">Código de Cart</text><text x="560" y="50">Diagrama</text></g>
<rect x="40" y="90" width="440" height="48" rx="4" fill="#161b22" stroke="#30363d"/><rect x="560" y="90" width="400" height="48" rx="4" fill="#161b22" stroke="#3fb950"/><line x1="480" y1="114" x2="556" y2="114" stroke="#3fb950" stroke-width="2" marker-end="url(#open)"/><text x="56" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f0f6fc">private final Customer customer;</text><text x="576" y="111" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f0f6fc">Cart --&gt; "1" Customer</text><text x="576" y="131" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#3fb950">asociación</text>
<rect x="40" y="160" width="440" height="48" rx="4" fill="#161b22" stroke="#30363d"/><rect x="560" y="160" width="400" height="48" rx="4" fill="#161b22" stroke="#3fb950"/><line x1="480" y1="184" x2="556" y2="184" stroke="#3fb950" stroke-width="2" marker-end="url(#open)"/><text x="56" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f0f6fc">private List&lt;CartLine&gt; lines;</text><text x="576" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f0f6fc">Cart *-- "0..*" CartLine</text><text x="576" y="201" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#3fb950">composición: add() hace new CartLine</text>
<rect x="40" y="230" width="440" height="48" rx="4" fill="#161b22" stroke="#30363d"/><rect x="560" y="230" width="400" height="48" rx="4" fill="#161b22" stroke="#f85149"/><line x1="480" y1="254" x2="556" y2="254" stroke="#f85149" stroke-width="2" marker-end="url(#open)"/><text x="56" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f0f6fc">public Cart(Customer customer)</text><text x="576" y="251" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f0f6fc">—</text><text x="576" y="271" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#f85149">constructor: no pasa</text>
<rect x="40" y="300" width="440" height="48" rx="4" fill="#161b22" stroke="#30363d"/><rect x="560" y="300" width="400" height="48" rx="4" fill="#161b22" stroke="#3fb950"/><line x1="480" y1="324" x2="556" y2="324" stroke="#3fb950" stroke-width="2" marker-end="url(#open)"/><text x="56" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f0f6fc">public void add(Product p, int q)</text><text x="576" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f0f6fc">+ add(product: Product, quantity: Integer): void</text><text x="576" y="341" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#3fb950">operación</text>
<rect x="40" y="370" width="440" height="48" rx="4" fill="#161b22" stroke="#30363d"/><rect x="560" y="370" width="400" height="48" rx="4" fill="#161b22" stroke="#3fb950"/><line x1="480" y1="394" x2="556" y2="394" stroke="#3fb950" stroke-width="2" marker-end="url(#open)"/><text x="56" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f0f6fc">public Money total(PriceList prices)</text><text x="576" y="391" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f0f6fc">+ total(prices: PriceList): Money</text><text x="576" y="411" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#3fb950">y Cart ..&gt; PriceList: solo parámetro</text>
<rect x="40" y="440" width="440" height="48" rx="4" fill="#161b22" stroke="#30363d"/><rect x="560" y="440" width="400" height="48" rx="4" fill="#161b22" stroke="#f85149"/><line x1="480" y1="464" x2="556" y2="464" stroke="#f85149" stroke-width="2" marker-end="url(#open)"/><text x="56" y="470" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f0f6fc">public List&lt;CartLine&gt; getLines()</text><text x="576" y="461" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f0f6fc">—</text><text x="576" y="481" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#f85149">getter: no pasa</text>
<text x="40" y="556" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#8b949e">Verde: pasa al diagrama. Rojo: se queda en el código.</text>
</svg>
