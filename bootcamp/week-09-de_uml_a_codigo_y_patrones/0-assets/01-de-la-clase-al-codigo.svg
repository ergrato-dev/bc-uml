<g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#8b949e"><text x="40" y="440">Cada parte de la clase se convierte en una línea concreta. La asociación navegable con 0..* es un campo colección en Member;</text><text x="40" y="460">Loan no recibe un campo member porque la flecha no va hacia allí.</text></g>
