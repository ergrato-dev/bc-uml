<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img">
<title>Roles de los cuatro patrones de la semana. Strategy: Context se asocia a la interfaz Strategy, que realiza ConcreteStrategy. Observer: Subject se asocia a muchos Observer, ConcreteSubject hereda de Subject y ConcreteObserver realiza Observer. Factory Method: Creator depende de Product, ConcreteCreator hereda de Creator y depende de ConcreteProduct, que hereda de Product. Adapter: Client se asocia a la interfaz Target, Adapter la realiza y se asocia a Adaptee, la clase ajena</title>
<rect width="1000" height="660" fill="#0d1117"/>
<defs>
<marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#0d1117" stroke="#f0f6fc" stroke-width="1.2"/></marker>
<marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#f0f6fc" stroke-width="1.5"/></marker>
<marker id="dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="18" markerHeight="12" orient="auto"><path d="M1 5 L8 1 L15 5 L8 9 Z" fill="#f0f6fc"/></marker>
</defs>
<g transform="translate(20 20)"><rect width="470" height="250" rx="8" fill="none" stroke="#30363d"/><text x="20" y="30" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#f0f6fc">Strategy</text>
<rect x="20" y="50" width="170" height="44" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="105" y="78" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f0f6fc">«Context»</text>
<rect x="290" y="50" width="170" height="44" rx="4" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="375" y="78" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f0f6fc">«Strategy»</text>
<rect x="290" y="180" width="170" height="44" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="375" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f0f6fc">«ConcreteStrategy»</text>
<line x1="190" y1="72" x2="288" y2="72" stroke="#f0f6fc" stroke-width="1.8" marker-end="url(#open)"/>
<line x1="375" y1="180" x2="375" y2="96" stroke="#f0f6fc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#tri)"/>
