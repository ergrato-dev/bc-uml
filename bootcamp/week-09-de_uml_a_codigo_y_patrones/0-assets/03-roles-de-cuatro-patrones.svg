<rect x="290" y="50" width="170" height="44" rx="4" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="375" y="78" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f0f6fc">«Product»</text>
