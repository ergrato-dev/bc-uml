<rect x="290" y="50" width="170" height="44" rx="4" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="375" y="78" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f0f6fc">«Target»</text>
<rect x="290" y="180" width="170" height="44" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="375" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f0f6fc">«Adapter»</text>
<rect x="20" y="180" width="170" height="44" rx="4" fill="#161b22" stroke="#e3b341" stroke-width="2"/><text x="105" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f0f6fc">«Adaptee»</text>
<line x1="190" y1="72" x2="288" y2="72" stroke="#f0f6fc" stroke-width="1.8" marker-end="url(#open)"/>
<line x1="375" y1="180" x2="375" y2="96" stroke="#f0f6fc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#tri)"/>
<line x1="290" y1="202" x2="192" y2="202" stroke="#f0f6fc" stroke-width="1.8" marker-end="url(#open)"/>
</g>
<g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#8b949e"><rect x="20" y="578" width="22" height="16" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="50" y="591">interfaz o clase abstracta</text><rect x="240" y="578" width="22" height="16" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="270" y="591">clase concreta</text><rect x="400" y="578" width="22" height="16" fill="#161b22" stroke="#e3b341" stroke-width="2"/><text x="430" y="591">clase ajena que no puedes cambiar</text></g>
