<rect x="290" y="180" width="170" height="44" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="375" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f0f6fc">«ConcreteProduct»</text>
<line x1="190" y1="72" x2="288" y2="72" stroke="#f0f6fc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/>
<line x1="105" y1="180" x2="105" y2="96" stroke="#f0f6fc" stroke-width="1.8" marker-end="url(#tri)"/>
<line x1="375" y1="180" x2="375" y2="96" stroke="#f0f6fc" stroke-width="1.8" marker-end="url(#tri)"/>
<line x1="190" y1="202" x2="288" y2="202" stroke="#f0f6fc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/>
</g>
<g transform="translate(510 290)"><rect width="470" height="250" rx="8" fill="none" stroke="#30363d"/><text x="20" y="30" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#f0f6fc">Adapter</text>
