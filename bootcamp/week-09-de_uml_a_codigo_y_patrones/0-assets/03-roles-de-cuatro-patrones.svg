<line x1="190" y1="72" x2="288" y2="72" stroke="#f0f6fc" stroke-width="1.8" marker-end="url(#open)"/><text x="239.0" y="64" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f78166">0..*</text>
<line x1="105" y1="180" x2="105" y2="96" stroke="#f0f6fc" stroke-width="1.8" marker-end="url(#tri)"/>
<line x1="375" y1="180" x2="375" y2="96" stroke="#f0f6fc" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#tri)"/>
