<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img">
  <title>Include y extend comparados: en include la flecha va del caso base Borrow book al incluido Identify member, que se ejecuta siempre; en extend la flecha va de la extensión Choose premium seat al caso base Buy ticket, que declara el punto de extensión seat selection, no conoce la extensión y la ejecuta solo si se cumple la condición</title>
  <rect width="1100" height="470" fill="#0d1117"/>
  <text x="40" y="50" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#f0f6fc">«include»: siempre</text>
  <text x="580" y="50" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#f0f6fc">«extend»: solo si se cumple la condición</text>
  <line x1="550" y1="30" x2="550" y2="440" stroke="#30363d" stroke-width="1"/>
  <ellipse cx="130" cy="170" rx="95" ry="26" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="130" y="175" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" fill="#f0f6fc">Borrow book</text>
  <ellipse cx="420" cy="170" rx="100" ry="26" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="420" y="175" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" fill="#f0f6fc">Identify member</text>
  <line x1="225" y1="170" x2="320" y2="170" stroke="#f78166" stroke-width="2" stroke-dasharray="7 5"/>
  <polyline points="304,161 320,170 304,179" fill="none" stroke="#f78166" stroke-width="2"/>
  <text x="272" y="158" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#f78166">«include»</text>
  <text x="130" y="220" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e">caso base</text>
  <text x="420" y="220" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e">incluido</text>
  <ellipse cx="960" cy="170" rx="110" ry="46" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="960" y="152" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" fill="#f0f6fc">Buy ticket</text>
  <line x1="862" y1="162" x2="1058" y2="162" stroke="#30363d" stroke-width="2"/>
  <text x="960" y="182" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#8b949e">extension points:</text>
  <text x="960" y="200" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#a371f7">seat selection</text>
  <ellipse cx="670" cy="170" rx="95" ry="26" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="670" y="175" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#f0f6fc">Choose premium seat</text>
  <line x1="765" y1="170" x2="850" y2="170" stroke="#f78166" stroke-width="2" stroke-dasharray="7 5"/>
  <polyline points="834,161 850,170 834,179" fill="none" stroke="#f78166" stroke-width="2"/>
  <text x="808" y="158" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#f78166">«extend»</text>
  <text x="670" y="220" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e">extensión</text>
  <text x="960" y="240" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e">caso base</text>
  <rect x="600" y="262" width="300" height="52" rx="3" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="614" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f0f6fc">condition: customer is a member</text>
  <text x="614" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f0f6fc">extension point: seat selection</text>
  <text x="40" y="370" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#3fb950">La flecha sale del caso base</text>
  <text x="40" y="396" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#3fb950">El base no funciona sin el incluido</text>
  <text x="40" y="422" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#3fb950">Sirve para pasos que repiten varios casos</text>
  <text x="580" y="370" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#3fb950">La flecha sale de la extensión</text>
  <text x="580" y="396" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#3fb950">El base funciona completo sin ella</text>
  <text x="580" y="422" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#3fb950">Se engancha en un punto de extensión</text>
</svg>
