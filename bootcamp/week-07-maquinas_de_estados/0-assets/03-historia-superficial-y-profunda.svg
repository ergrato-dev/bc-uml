<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img">
<title>Historia superficial frente a historia profunda en el estado compuesto Fulfilling, que contiene Picking y el compuesto Packing con Boxing y Labelling: el pedido estaba en Labelling al salir a OnHold; al volver con H entra en Packing y empieza otra vez en Boxing; al volver con H* vuelve directamente a Labelling</title>
<rect width="1000" height="490" fill="#0d1117"/>
<text x="250" y="40" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#f0f6fc">Historia superficial [H]</text>
<rect x="30" y="64" width="440" height="236" rx="16" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
<text x="250" y="88" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" fill="#f0f6fc">Fulfilling</text>
<line x1="30" y1="100" x2="470" y2="100" stroke="#30363d"/>
<circle cx="64" cy="140" r="15" fill="#0d1117" stroke="#f0f6fc" stroke-width="1.5"/>
<text x="64" y="145" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#f0f6fc">H</text>
<rect x="96" y="122" width="110" height="38" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="151" y="146" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">Picking</text>
<rect x="226" y="116" width="228" height="170" rx="14" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
<text x="340" y="138" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">Packing</text>
<line x1="226" y1="148" x2="454" y2="148" stroke="#30363d"/>
<circle cx="248" cy="181" r="6" fill="#f0f6fc"/>
<line x1="254" y1="181" x2="282" y2="181" stroke="#f0f6fc" stroke-width="1.5"/>
<polyline points="276,176 284,181 276,186" fill="none" stroke="#f0f6fc" stroke-width="1.5"/>
<rect x="286" y="162" width="140" height="38" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="356" y="186" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">Boxing</text>
<line x1="356" y1="200" x2="356" y2="226" stroke="#f0f6fc" stroke-width="1.5"/>
<polyline points="351,220 356,228 361,220" fill="none" stroke="#f0f6fc" stroke-width="1.5"/>
<rect x="286" y="230" width="140" height="38" rx="12" fill="#161b22" stroke="#e3b341" stroke-width="2" stroke-dasharray="6 4"/>
<text x="356" y="254" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">Labelling</text>
<line x1="180" y1="300" x2="180" y2="328" stroke="#f0f6fc" stroke-width="1.5"/>
<polyline points="175,322 180,330 185,322" fill="none" stroke="#f0f6fc" stroke-width="1.5"/>
<text x="190" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">addressProblem</text>
<rect x="30" y="330" width="170" height="40" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
<text x="115" y="355" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">OnHold</text>
<line x1="64" y1="330" x2="64" y2="158" stroke="#f78166" stroke-width="2"/>
<polyline points="58,166 64,156 70,166" fill="none" stroke="#f78166" stroke-width="2"/>
<text x="72" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f78166">addressFixed</text>
<text x="750" y="40" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#f0f6fc">Historia profunda [H*]</text>
<rect x="530" y="64" width="440" height="236" rx="16" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
<text x="750" y="88" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" fill="#f0f6fc">Fulfilling</text>
<line x1="530" y1="100" x2="970" y2="100" stroke="#30363d"/>
<circle cx="564" cy="140" r="15" fill="#0d1117" stroke="#f0f6fc" stroke-width="1.5"/>
<text x="564" y="145" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#f0f6fc">H*</text>
<rect x="596" y="122" width="110" height="38" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="651" y="146" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">Picking</text>
<rect x="726" y="116" width="228" height="170" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="840" y="138" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">Packing</text>
<line x1="726" y1="148" x2="954" y2="148" stroke="#30363d"/>
<circle cx="748" cy="181" r="6" fill="#f0f6fc"/>
<line x1="754" y1="181" x2="782" y2="181" stroke="#f0f6fc" stroke-width="1.5"/>
<polyline points="776,176 784,181 776,186" fill="none" stroke="#f0f6fc" stroke-width="1.5"/>
<rect x="786" y="162" width="140" height="38" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="856" y="186" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">Boxing</text>
<line x1="856" y1="200" x2="856" y2="226" stroke="#f0f6fc" stroke-width="1.5"/>
<polyline points="851,220 856,228 861,220" fill="none" stroke="#f0f6fc" stroke-width="1.5"/>
<rect x="786" y="230" width="140" height="38" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="856" y="254" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">Labelling</text>
<line x1="680" y1="300" x2="680" y2="328" stroke="#f0f6fc" stroke-width="1.5"/>
<polyline points="675,322 680,330 685,322" fill="none" stroke="#f0f6fc" stroke-width="1.5"/>
<text x="690" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">addressProblem</text>
<rect x="530" y="330" width="170" height="40" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
<text x="615" y="355" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">OnHold</text>
<line x1="564" y1="330" x2="564" y2="158" stroke="#f78166" stroke-width="2"/>
<polyline points="558,166 564,156 570,166" fill="none" stroke="#f78166" stroke-width="2"/>
<text x="572" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f78166">addressFixed</text>
<line x1="500" y1="20" x2="500" y2="440" stroke="#30363d"/>
<text x="30" y="400" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" fill="#f0f6fc">Vuelve a Packing y entra por su estado inicial:</text>
<text x="30" y="422" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" fill="#f0f6fc">empieza otra vez en Boxing.</text>
<text x="530" y="400" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" fill="#f0f6fc">Vuelve a Labelling: recuerda el subestado</text>
<text x="530" y="422" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" fill="#f0f6fc">en todos los niveles de anidamiento.</text>
<rect x="250" y="452" width="26" height="16" rx="4" fill="none" stroke="#e3b341" stroke-width="2" stroke-dasharray="6 4"/>
<text x="284" y="465" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e">dónde estaba al salir a OnHold</text>
<rect x="530" y="452" width="26" height="16" rx="4" fill="none" stroke="#3fb950" stroke-width="2"/>
<text x="564" y="465" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e">dónde queda al volver</text>
</svg>
