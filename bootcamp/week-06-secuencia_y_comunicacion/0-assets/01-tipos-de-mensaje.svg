<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img">
<title>Los cinco tipos de mensaje de un diagrama de secuencia: síncrono con línea continua y punta rellena, respuesta con línea discontinua, asíncrono con línea continua y punta abierta, creación con línea discontinua hacia la caja del objeto nuevo y destrucción con una X al final de la lifeline; cada uno con su sintaxis PlantUML</title>
<rect width="1000" height="560" fill="#0d1117"/>
<g font-family="Inter, system-ui, -apple-system, sans-serif" fill="#8b949e" font-size="14" font-weight="bold">
<text x="40" y="45">Mensaje</text>
<text x="300" y="45">Notación UML</text>
<text x="640" y="45">PlantUML</text>
</g>
<line x1="30" y1="60" x2="970" y2="60" stroke="#30363d"/>
<g font-family="Inter, system-ui, -apple-system, sans-serif">
<text x="40" y="112" font-size="17" font-weight="bold" fill="#f0f6fc">Síncrono</text>
<text x="40" y="134" font-size="13" fill="#8b949e">llama y espera</text>
<text x="40" y="202" font-size="17" font-weight="bold" fill="#f0f6fc">Respuesta</text>
<text x="40" y="224" font-size="13" fill="#8b949e">devuelve un valor</text>
<text x="40" y="292" font-size="17" font-weight="bold" fill="#f0f6fc">Asíncrono</text>
<text x="40" y="314" font-size="13" fill="#8b949e">envía y sigue</text>
<text x="40" y="382" font-size="17" font-weight="bold" fill="#f0f6fc">Creación</text>
<text x="40" y="404" font-size="13" fill="#8b949e">el objeto nace aquí</text>
<text x="40" y="482" font-size="17" font-weight="bold" fill="#f0f6fc">Destrucción</text>
<text x="40" y="504" font-size="13" fill="#8b949e">el objeto deja de existir</text>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f0f6fc">
<text x="300" y="105">op(x)</text>
<text x="420" y="195">valor</text>
<text x="300" y="285">op(x)</text>
<text x="300" y="375">«create»</text>
</g>
<line x1="300" y1="115" x2="560" y2="115" stroke="#f78166" stroke-width="2"/>
<polygon points="560,115 546,108 546,122" fill="#f78166"/>
<line x1="560" y1="205" x2="300" y2="205" stroke="#f78166" stroke-width="2" stroke-dasharray="7 5"/>
<polyline points="314,198 300,205 314,212" fill="none" stroke="#f78166" stroke-width="2"/>
<line x1="300" y1="295" x2="560" y2="295" stroke="#f78166" stroke-width="2"/>
<polyline points="546,288 560,295 546,302" fill="none" stroke="#f78166" stroke-width="2"/>
<line x1="300" y1="385" x2="500" y2="385" stroke="#f78166" stroke-width="2" stroke-dasharray="7 5"/>
<polyline points="486,378 500,385 486,392" fill="none" stroke="#f78166" stroke-width="2"/>
<rect x="500" y="368" width="80" height="34" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="540" y="390" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#79c0ff">:Loan</text>
<line x1="540" y1="402" x2="540" y2="420" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="430" y1="445" x2="430" y2="485" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="416" y1="485" x2="444" y2="513" stroke="#f85149" stroke-width="3"/>
<line x1="444" y1="485" x2="416" y2="513" stroke="#f85149" stroke-width="3"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a371f7">
<text x="640" y="120">a -&gt; b : op(x)</text>
<text x="640" y="210">b --&gt; a : valor</text>
<text x="640" y="300">a -&gt;&gt; b : op(x)</text>
<text x="640" y="380">create b</text>
<text x="640" y="402">a --&gt;&gt; b : &lt;&lt;create&gt;&gt; B()</text>
<text x="640" y="500">destroy b</text>
</g>
<g stroke="#30363d"><line x1="30" y1="160" x2="970" y2="160"/><line x1="30" y1="250" x2="970" y2="250"/><line x1="30" y1="340" x2="970" y2="340"/><line x1="30" y1="430" x2="970" y2="430"/></g>
</svg>
