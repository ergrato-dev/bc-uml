<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img">
<title>La misma interacción en dos diagramas: a la izquierda, secuencia, con cuatro lifelines y los mensajes lend, isAvailable, create y markAsLent ordenados de arriba abajo; a la derecha, comunicación, con los mismos cuatro objetos unidos por enlaces y los mensajes numerados 1, 1.1, 1.2 y 1.3 sobre ellos</title>
<rect width="1100" height="480" fill="#0d1117"/>
<g font-family="Inter, system-ui, -apple-system, sans-serif">
<text x="30" y="40" font-size="18" font-weight="bold" fill="#f0f6fc">Secuencia</text>
<text x="30" y="62" font-size="14" fill="#8b949e">el orden se lee de arriba abajo</text>
<text x="600" y="40" font-size="18" font-weight="bold" fill="#f0f6fc">Comunicación</text>
<text x="600" y="62" font-size="14" fill="#8b949e">el orden se lee por el número</text>
</g>
<line x1="570" y1="25" x2="570" y2="455" stroke="#30363d"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle" fill="#79c0ff">
<rect x="30" y="90" width="110" height="32" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="85" y="111">:LoanScreen</text>
<rect x="160" y="90" width="120" height="32" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="220" y="111">:LoanService</text>
<rect x="320" y="90" width="80" height="32" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="360" y="111">:Copy</text>
<rect x="430" y="265" width="80" height="32" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="470" y="286">:Loan</text>
</g>
<g stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4"><line x1="85" y1="122" x2="85" y2="440"/><line x1="220" y1="122" x2="220" y2="440"/><line x1="360" y1="122" x2="360" y2="440"/><line x1="470" y1="297" x2="470" y2="440"/></g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f0f6fc">
<text x="95" y="160">lend()</text>
<text x="230" y="215">isAvailable()</text>
<text x="230" y="275">«create»</text>
<text x="230" y="365">markAsLent()</text>
</g>
<line x1="85" y1="170" x2="220" y2="170" stroke="#f78166" stroke-width="2"/><polygon points="220,170 206,163 206,177" fill="#f78166"/>
<line x1="220" y1="225" x2="360" y2="225" stroke="#f78166" stroke-width="2"/><polygon points="360,225 346,218 346,232" fill="#f78166"/>
<line x1="220" y1="281" x2="430" y2="281" stroke="#f78166" stroke-width="2" stroke-dasharray="7 5"/><polyline points="416,274 430,281 416,288" fill="none" stroke="#f78166" stroke-width="2"/>
<line x1="220" y1="375" x2="360" y2="375" stroke="#f78166" stroke-width="2"/><polygon points="360,375 346,368 346,382" fill="#f78166"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle" fill="#79c0ff">
<rect x="780" y="95" width="110" height="32" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="835" y="116">:LoanScreen</text>
<rect x="775" y="235" width="120" height="32" rx="4" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="835" y="256">:LoanService</text>
<rect x="620" y="390" width="80" height="32" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="660" y="411">:Copy</text>
<rect x="970" y="390" width="80" height="32" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="1010" y="411">:Loan</text>
</g>
<g stroke="#8b949e" stroke-width="2"><line x1="835" y1="127" x2="835" y2="235"/><line x1="800" y1="267" x2="680" y2="390"/><line x1="870" y1="267" x2="990" y2="390"/></g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f0f6fc">
<text x="850" y="178"><tspan fill="#a371f7">1:</tspan> lend() <tspan fill="#f78166" font-size="20" font-weight="bold">↓</tspan></text>
<text x="600" y="312"><tspan fill="#a371f7">1.1:</tspan> isAvailable() <tspan fill="#f78166" font-size="20" font-weight="bold">↙</tspan></text>
<text x="600" y="332"><tspan fill="#a371f7">1.3:</tspan> markAsLent()</text>
<text x="935" y="320"><tspan fill="#a371f7">1.2:</tspan> «create» <tspan fill="#f78166" font-size="20" font-weight="bold">↘</tspan></text>
</g>
</svg>
