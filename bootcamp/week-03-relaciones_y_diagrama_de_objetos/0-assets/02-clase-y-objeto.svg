<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img">
  <title>Una clase Book y una instancia suya lado a lado: el objeto se nombra "dune : Book" subrayado, cada atributo con tipo se convierte en un slot con valor y desaparecen visibilidad y operaciones; abajo, la asociación Member 1 a 0..* Loan se convierte en un link entre ana : Member y l1 : Loan, sin multiplicidad</title>
  <rect width="1100" height="560" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" fill="#8b949e">
    <text x="80" y="44">Diagrama de clases: todas las situaciones</text>
    <text x="620" y="44">Diagrama de objetos: una situación</text>
  </g>

  <!-- Clase -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <rect x="80" y="70" width="340" height="190" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="250" y="100" text-anchor="middle" fill="#f0f6fc" font-weight="bold" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18">Book</text>
    <line x1="80" y1="116" x2="420" y2="116" stroke="#30363d" stroke-width="2"/>
    <text x="96" y="144" fill="#f0f6fc">- title: String</text>
    <text x="96" y="170" fill="#f0f6fc">- isbn: String</text>
    <text x="96" y="196" fill="#f0f6fc">- year: Integer</text>
    <line x1="80" y1="212" x2="420" y2="212" stroke="#30363d" stroke-width="2"/>
    <text x="96" y="242" fill="#f0f6fc">+ isAvailable(): Boolean</text>
  </g>

  <!-- Objeto -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <rect x="620" y="70" width="340" height="142" rx="4" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="790" y="100" text-anchor="middle" fill="#f0f6fc" font-weight="bold" text-decoration="underline">dune : Book</text>
    <line x1="620" y1="116" x2="960" y2="116" stroke="#30363d" stroke-width="2"/>
    <text x="636" y="144" fill="#f0f6fc">title = "Dune"</text>
    <text x="636" y="170" fill="#f0f6fc">isbn = "978-0441013593"</text>
    <text x="636" y="196" fill="#f0f6fc">year = 1965</text>
  </g>

  <!-- instancia de -->
  <line x1="612" y1="140" x2="432" y2="140" stroke="#f78166" stroke-width="2" stroke-dasharray="7 5"/>
  <polyline points="448,131 432,140 448,149" fill="none" stroke="#f78166" stroke-width="2"/>
  <text x="522" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f78166">«instanceOf»</text>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#3fb950">
    <text x="620" y="240">Nombre subrayado: objeto : Clase</text>
    <text x="620" y="262">Atributo con tipo → slot con valor</text>
    <text x="620" y="284">Sin visibilidad ni operaciones</text>
  </g>

  <line x1="40" y1="320" x2="1060" y2="320" stroke="#30363d" stroke-width="1"/>

  <!-- Asociación -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <rect x="80" y="380" width="110" height="40" rx="3" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="135" y="405" text-anchor="middle" fill="#f0f6fc">Member</text>
    <rect x="310" y="380" width="110" height="40" rx="3" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="365" y="405" text-anchor="middle" fill="#f0f6fc">Loan</text>
    <line x1="190" y1="400" x2="310" y2="400" stroke="#f78166" stroke-width="2"/>
    <text x="198" y="390" font-size="13" fill="#f0f6fc">1</text>
    <text x="302" y="390" text-anchor="end" font-size="13" fill="#f0f6fc">0..*</text>
  </g>
  <text x="80" y="460" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#8b949e">Asociación: con multiplicidad</text>

  <!-- Link -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <rect x="620" y="380" width="140" height="40" rx="3" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="690" y="405" text-anchor="middle" fill="#f0f6fc" text-decoration="underline">ana : Member</text>
    <rect x="840" y="380" width="120" height="40" rx="3" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="900" y="405" text-anchor="middle" fill="#f0f6fc" text-decoration="underline">l1 : Loan</text>
    <line x1="760" y1="400" x2="840" y2="400" stroke="#f78166" stroke-width="2"/>
  </g>
  <text x="620" y="460" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#8b949e">Link: une dos objetos, sin multiplicidad</text>
  <text x="620" y="484" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#8b949e">Se cuentan los links para comprobarla</text>
</svg>
