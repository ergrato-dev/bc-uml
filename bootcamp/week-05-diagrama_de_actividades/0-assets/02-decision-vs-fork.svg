<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img">
<title>Decisión frente a fork: a la izquierda, una decisión con guardas [yes] y [no] por la que pasa una sola rama y una fusión que deja pasar el primer token que llega; a la derecha, un fork por el que salen todas las ramas a la vez y un join que espera a que terminen todas</title>
<rect width="1100" height="520" fill="#0d1117"/>
<text x="40" y="45" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#f0f6fc">Decisión: sale una rama</text>
<text x="580" y="45" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#f0f6fc">Fork: salen todas las ramas</text>
<line x1="550" y1="25" x2="550" y2="490" stroke="#30363d"/>
<line x1="275" y1="70" x2="275" y2="98" stroke="#8b949e" stroke-width="2"/>
<polyline points="269,88 275,98 281,88" fill="none" stroke="#8b949e" stroke-width="2"/>
<polygon points="275,98 301,120 275,142 249,120" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
<line x1="249" y1="120" x2="145" y2="120" stroke="#8b949e" stroke-width="2"/>
<line x1="145" y1="120" x2="145" y2="190" stroke="#8b949e" stroke-width="2"/>
<polyline points="139,180 145,190 151,180" fill="none" stroke="#8b949e" stroke-width="2"/>
<line x1="301" y1="120" x2="405" y2="120" stroke="#8b949e" stroke-width="2"/>
<line x1="405" y1="120" x2="405" y2="190" stroke="#8b949e" stroke-width="2"/>
<polyline points="399,180 405,190 411,180" fill="none" stroke="#8b949e" stroke-width="2"/>
<text x="195" y="110" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#e3b341">[yes]</text>
<text x="355" y="110" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#e3b341">[no]</text>
<text x="315" y="80" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e">Fines paid?</text>
<rect x="60" y="190" width="170" height="44" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="145" y="217" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">Lend copy</text>
<rect x="320" y="190" width="170" height="44" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="405" y="217" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">Ask for payment</text>
<line x1="145" y1="234" x2="145" y2="310" stroke="#8b949e" stroke-width="2"/>
<line x1="145" y1="310" x2="249" y2="310" stroke="#8b949e" stroke-width="2"/>
<polyline points="239,304 249,310 239,316" fill="none" stroke="#8b949e" stroke-width="2"/>
<line x1="405" y1="234" x2="405" y2="310" stroke="#8b949e" stroke-width="2"/>
<line x1="405" y1="310" x2="301" y2="310" stroke="#8b949e" stroke-width="2"/>
<polyline points="311,304 301,310 311,316" fill="none" stroke="#8b949e" stroke-width="2"/>
<polygon points="275,288 301,310 275,332 249,310" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
<line x1="275" y1="332" x2="275" y2="370" stroke="#8b949e" stroke-width="2"/>
<polyline points="269,360 275,370 281,360" fill="none" stroke="#8b949e" stroke-width="2"/>
<text x="275" y="420" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" fill="#f0f6fc">Pasa una sola rama: la que cumple su guarda.</text>
<text x="275" y="446" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" fill="#f0f6fc">La fusión deja seguir en cuanto llega.</text>
<text x="275" y="478" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a371f7">if / else / endif</text>
<line x1="825" y1="70" x2="825" y2="105" stroke="#8b949e" stroke-width="2"/>
<polyline points="819,95 825,105 831,95" fill="none" stroke="#8b949e" stroke-width="2"/>
<rect x="675" y="105" width="300" height="10" fill="#f0f6fc"/>
<line x1="695" y1="115" x2="695" y2="190" stroke="#8b949e" stroke-width="2"/>
<polyline points="689,180 695,190 701,180" fill="none" stroke="#8b949e" stroke-width="2"/>
<line x1="955" y1="115" x2="955" y2="190" stroke="#8b949e" stroke-width="2"/>
<polyline points="949,180 955,190 961,180" fill="none" stroke="#8b949e" stroke-width="2"/>
<rect x="610" y="190" width="170" height="44" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="695" y="217" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">Sell tickets</text>
<rect x="870" y="190" width="170" height="44" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="955" y="217" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">Clean room</text>
<line x1="695" y1="234" x2="695" y2="305" stroke="#8b949e" stroke-width="2"/>
<polyline points="689,295 695,305 701,295" fill="none" stroke="#8b949e" stroke-width="2"/>
<line x1="955" y1="234" x2="955" y2="305" stroke="#8b949e" stroke-width="2"/>
<polyline points="949,295 955,305 961,295" fill="none" stroke="#8b949e" stroke-width="2"/>
<rect x="675" y="305" width="300" height="10" fill="#f0f6fc"/>
<line x1="825" y1="315" x2="825" y2="370" stroke="#8b949e" stroke-width="2"/>
<polyline points="819,360 825,370 831,360" fill="none" stroke="#8b949e" stroke-width="2"/>
<text x="825" y="420" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" fill="#f0f6fc">Se ejecutan todas, en cualquier orden.</text>
<text x="825" y="446" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" fill="#f0f6fc">El join espera a que terminen todas.</text>
<text x="825" y="478" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a371f7">fork / fork again / end fork</text>
</svg>
