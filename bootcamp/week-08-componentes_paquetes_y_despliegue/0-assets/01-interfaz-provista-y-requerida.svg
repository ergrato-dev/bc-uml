<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img">
<title>Anatomía de un ensamblaje entre componentes: Orders requiere la interfaz PaymentGateway, dibujada como un semicírculo; Payments la provee, dibujada como un círculo; el semicírculo encaja en el círculo y los dos componentes solo conocen la interfaz</title>
<rect width="1000" height="440" fill="#0d1117"/>
<g font-family="Inter, system-ui, -apple-system, sans-serif" fill="#f0f6fc" font-size="18">
<rect x="60" y="150" width="200" height="80" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="160" y="197" text-anchor="middle">Orders</text>
<rect x="740" y="150" width="200" height="80" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="840" y="197" text-anchor="middle">Payments</text>
</g>
<g fill="#161b22" stroke="#58a6ff" stroke-width="1.5">
<rect x="226" y="160" width="22" height="16"/>
<rect x="221" y="163" width="10" height="4"/>
<rect x="221" y="169" width="10" height="4"/>
<rect x="906" y="160" width="22" height="16"/>
<rect x="901" y="163" width="10" height="4"/>
<rect x="901" y="169" width="10" height="4"/>
</g>
<g stroke="#f0f6fc" stroke-width="2" fill="none">
<line x1="260" y1="190" x2="474" y2="190"/>
<path d="M 474 166 A 24 24 0 0 1 474 214" stroke="#f78166" stroke-width="3"/>
<line x1="514" y1="190" x2="740" y2="190"/>
</g>
<circle cx="500" cy="190" r="14" fill="#161b22" stroke="#3fb950" stroke-width="3"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#f0f6fc" text-anchor="middle">
<text x="500" y="250">PaymentGateway</text>
<text x="300" y="350">Orders --( PaymentGateway</text>
<text x="700" y="350">Payments -- PaymentGateway</text>
</g>
<g font-family="Inter, system-ui, -apple-system, sans-serif" text-anchor="middle">
<text x="500" y="60" font-size="20" fill="#a371f7" font-weight="600">Ensamblaje</text>
<text x="500" y="88" font-size="15" fill="#8b949e">el enchufe encaja en la piruleta</text>
<line x1="500" y1="98" x2="500" y2="160" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="300" y="300" font-size="17" fill="#f78166">Interfaz requerida (enchufe)</text>
<text x="300" y="322" font-size="14" fill="#8b949e">Orders no funciona sin ella</text>
<text x="700" y="300" font-size="17" fill="#3fb950">Interfaz provista (piruleta)</text>
<text x="700" y="322" font-size="14" fill="#8b949e">Payments la implementa</text>
<text x="500" y="405" font-size="15" fill="#8b949e">Orders y Payments solo conocen PaymentGateway: Payments se puede cambiar por otro componente que la provea.</text>
</g>
</svg>
