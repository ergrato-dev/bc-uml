<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 525" role="img">
<title>Anatomía de una matriz de trazabilidad con sus dos lecturas y los huecos que revela</title>
<rect width="960" height="525" fill="#0d1117"/>
<text x="480" y="40" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" fill="#f0f6fc" text-anchor="middle" font-weight="bold">Matriz de trazabilidad de una tienda: se lee en dos direcciones</text>
<rect x="60" y="90" width="840" height="220" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="72" y="118" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="start" font-weight="bold">CU</text>
<text x="162" y="118" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="start" font-weight="bold">Caso de uso</text>
<line x1="150" y1="90" x2="150" y2="310" stroke="#30363d" stroke-width="1"/>
<text x="332" y="118" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="start" font-weight="bold">Clases</text>
<line x1="320" y1="90" x2="320" y2="310" stroke="#30363d" stroke-width="1"/>
<text x="662" y="118" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="start" font-weight="bold">Diagramas</text>
<line x1="650" y1="90" x2="650" y2="310" stroke="#30363d" stroke-width="1"/>
<line x1="60" y1="134" x2="900" y2="134" stroke="#30363d" stroke-width="1"/>
<text x="72" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#3fb950" text-anchor="start" font-weight="normal">CU-01</text>
<text x="162" y="162" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="start" font-weight="normal">Browse catalog</text>
<text x="332" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#79c0ff" text-anchor="start" font-weight="normal">Product, Category</text>
<text x="662" y="162" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="start" font-weight="normal">04, 02</text>
<line x1="60" y1="178" x2="900" y2="178" stroke="#30363d" stroke-width="1"/>
<text x="72" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#3fb950" text-anchor="start" font-weight="normal">CU-02</text>
<text x="162" y="206" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="start" font-weight="normal">Place order</text>
<text x="332" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#79c0ff" text-anchor="start" font-weight="normal">Cart, CartLine, Order, Customer</text>
<text x="662" y="206" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="start" font-weight="normal">06 secuencia, 07 estados</text>
<line x1="60" y1="222" x2="900" y2="222" stroke="#30363d" stroke-width="1"/>
<text x="72" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#3fb950" text-anchor="start" font-weight="normal">CU-03</text>
<text x="162" y="250" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="start" font-weight="normal">Pay order</text>
<text x="332" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#79c0ff" text-anchor="start" font-weight="normal">Order, Payment, PaymentGateway</text>
<text x="662" y="250" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="start" font-weight="normal">06 secuencia, 09 patrón</text>
<line x1="60" y1="266" x2="900" y2="266" stroke="#30363d" stroke-width="1"/>
<text x="72" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#3fb950" text-anchor="start" font-weight="normal">CU-04</text>
<text x="162" y="294" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="start" font-weight="normal">Track shipment</text>
<text x="332" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#79c0ff" text-anchor="start" font-weight="normal">Order, Shipment</text>
<text x="662" y="294" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#e3b341" text-anchor="start" font-weight="normal">07 estados</text>
<text x="60" y="360" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" fill="#3fb950" text-anchor="start" font-weight="bold">Hacia delante (fila a fila)</text>
<text x="60" y="385" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#8b949e" text-anchor="start" font-weight="normal">¿Qué clases necesita este caso de uso?</text>
<text x="60" y="410" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#e3b341" text-anchor="start" font-weight="normal">CU-04 tiene un solo diagrama:</text>
<text x="60" y="432" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#e3b341" text-anchor="start" font-weight="normal">requisito poco explicado</text>
<text x="500" y="360" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" fill="#79c0ff" text-anchor="start" font-weight="bold">Hacia atrás (clase a clase)</text>
<text x="500" y="385" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#8b949e" text-anchor="start" font-weight="normal">¿Qué caso de uso justifica esta clase?</text>
<rect x="500" y="400" width="400" height="50" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
<text x="515" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f85149" text-anchor="start" font-weight="bold">Wishlist</text>
<text x="600" y="430" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#f85149" text-anchor="start" font-weight="normal">está en 02-clases.puml y en ninguna fila</text>
<text x="480" y="495" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="normal">Cada hueco se escribe debajo de la tabla: un hueco declarado es una decisión</text>
</svg>
